name: Build Clean Single EXE with Custom Icon
on: [workflow_dispatch] 

jobs:
build:
runs-on: windows-latest
steps:
- name: Checkout Repository Files
uses: actions/checkout@v4 

* name: Install Nativefier
run: npm install -g nativefier
* name: Build Desktop App Folder
run: |
nativefier --name "MyMessenger" "[https://crystal-nexus-stream.lovable.app/](https://crystal-nexus-stream.lovable.app/)" --platform "windows" --arch "x64" --single-instance --disable-context-menu --disable-dev-tools --icon icon.ico
* name: Install Enigma Virtual Box
run: |
choco install enigmaruntime -y
* name: Pack Everything into Single EXE
shell: powershell
run: |
$currentDir = Get-Location

### Проверяем наличие папки приложения после сборки

if (-not (Test-Path "$currentDir\MyMessenger-win32-x64")) {
Write-Error "Папка с приложением не найдена! Проверьте логи Nativefier."
exit 1
} 

### Генерируем правильный файл конфигурации для сборщика

$xml = @" 

"@ 

[System.IO.File]::WriteAllText("currentDir\box.evb", xml) 

# Запуск упаковщика

& "C:\Program Files (x86)\Enigma Virtual Box\enigmavbcli.exe" box.evb

* name: Upload Single EXE File
uses: actions/upload-artifact@v4
with:
name: Premium-Single-EXE
path: MyMessenger_Single.exe